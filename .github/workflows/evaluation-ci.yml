name: evaluation-ci

on:
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/evaluation-ci.yml"
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/evaluation-ci.yml"

permissions:
  contents: read

jobs:
  evaluation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements-checks.txt
      - run: python -m pip install -r training/requirements-checks.txt
      - name: Dataset, matching, threshold and server contract checks
        run: |
          python -B -m unittest discover -s training -p test_evaluate.py
          python -B -m unittest discover -s training -p test_failure_report.py
          python -B -m unittest discover -s training -p test_operating_points.py
          python -B -m unittest discover -s training -p test_server_integration.py
