[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["zeroshot.py", "weights"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["zeroshot\\.py$"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
