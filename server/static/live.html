<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iris live view</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #eee; }
  #strip { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 12px; background: #1c1c1c; }
  #strip span b { color: #fff; font-weight: 600; }
  main { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; }
  canvas { max-width: 100%; background: #000; flex: 0 1 640px; }
  #events { flex: 1 1 280px; min-width: 260px; }
  #events h2 { margin: 0 0 6px; font-size: 14px; }
  #events ul { list-style: none; margin: 0; padding: 0; }
  #events li { padding: 4px 0; border-bottom: 1px solid #333; }
  .hit { color: #ff5a4f; }
  .dim { color: #9aa; }
  #legend i { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 10px; }
  .hitkey { background: #ff5a4f; }
  .weakkey { background: #7ec8ff; }
</style>
</head>
<body>
<div id="strip">
  <span>detector <b id="detector">-</b></span>
  <span>device <b id="device">-</b></span>
  <span>fps <b id="fps">-</b></span>
  <span>p50 <b id="p50">-</b> ms</span>
  <span>p95 <b id="p95">-</b> ms</span>
  <span>last frame <b id="age">-</b> s ago</span>
  <span>tuning <b id="tuning">-</b></span>
  <span id="legend"><i class="hitkey"></i>hit<i class="weakkey"></i>below conf_alert</span>
</div>
<main>
  <canvas id="view" width="640" height="480"></canvas>
  <section id="events"><h2>Alerts</h2><ul id="log"></ul></section>
</main>
<script>
"use strict";
// Everything the server sends goes onto the page through textContent or canvas text.
// The key comes from the address once, is kept in memory, and is then wiped from the URL.
const key = (() => {
  let k = new URLSearchParams(location.search).get("key");
  try {
    if (k) sessionStorage.setItem("iris-key", k);
    else k = sessionStorage.getItem("iris-key");
  } catch (e) { /* storage may be blocked; the key stays in memory */ }
  if (location.search) history.replaceState(null, "", location.pathname);
  return k;
})();
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const HIT = "#ff5a4f";
const WEAK = "#7ec8ff";
const KEPT_EVENTS = 200;
let lastEventId = 0;
let bootId = null;
let drawnFrameId = 0;

// The key goes in a header, never in a URL, and never to /health.
function get(path) {
  const headers = key && !path.startsWith("/health") ? { "X-Iris-Key": key } : {};
  return fetch(path, { cache: "no-store", headers });
}

async function getJson(path) {
  const r = await get(path);
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

function setText(id, value) {
  document.getElementById(id).textContent = value === null || value === undefined ? "-" : String(value);
}

function draw(bitmap, latest) {
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  ctx.drawImage(bitmap, 0, 0);
  ctx.lineWidth = Math.max(2, canvas.width / 320);
  ctx.font = Math.max(12, Math.round(canvas.width / 40)) + "px system-ui, sans-serif";
  ctx.textBaseline = "bottom";
  for (const d of latest.detections) {
    const color = d.conf >= latest.tuning.conf_alert ? HIT : WEAK;
    const x = d.box.x1 * canvas.width;
    const y = d.box.y1 * canvas.height;
    ctx.strokeStyle = color;
    ctx.strokeRect(x, y, (d.box.x2 - d.box.x1) * canvas.width, (d.box.y2 - d.box.y1) * canvas.height);
    ctx.fillStyle = color;
    ctx.fillText(d.label + " " + d.conf.toFixed(2), x + 2, Math.max(y - 2, 14));
  }
}

async function pollFrame() {
  try {
    const latest = await getJson("/latest");
    setText("age", latest.age_ms === null ? null : (latest.age_ms / 1000).toFixed(1));
    const t = latest.tuning;
    setText("tuning", "alert>=" + t.conf_alert + " " + t.needed + "/" + t.window +
      " cooldown " + t.cooldown_ms / 1000 + "s repeat " + t.same_side_repeat_ms / 1000 + "s");
    if (latest.frame_id !== 0 && latest.frame_id !== drawnFrameId) {
      const r = await get("/latest.jpg");
      // Draw only an image that is this /latest's frame; otherwise the next poll retries.
      if (r.ok && r.headers.get("X-Frame-Id") === String(latest.frame_id)) {
        const bitmap = await createImageBitmap(await r.blob(), { imageOrientation: "none" });
        try { draw(bitmap, latest); } finally { bitmap.close(); }
        drawnFrameId = latest.frame_id;
      }
    }
  } catch (e) {
    setText("age", "offline");
  }
}

async function pollHealth() {
  try {
    const h = await getJson("/health");
    setText("detector", h.detector);
    setText("device", h.device);
    setText("fps", h.fps);
    setText("p50", h.server_ms_p50);
    setText("p95", h.server_ms_p95);
  } catch (e) {
    setText("detector", "offline");
  }
}

function addEvent(log, e) {
  const li = document.createElement("li");
  const head = document.createElement("span");
  head.className = "hit";
  head.textContent = e.side + " " + Number(e.conf).toFixed(2);
  const at = document.createElement("span");
  at.className = "dim";
  at.textContent = " " + e.at;
  li.append(head, at);
  if (e.description) {
    const d = document.createElement("div");
    d.textContent = e.description;
    li.append(d);
  }
  log.prepend(li);
  lastEventId = Math.max(lastEventId, e.id);
}

async function pollEvents() {
  try {
    const log = document.getElementById("log");
    let reply = await getJson("/events?since=" + lastEventId);
    if (reply.boot_id !== bootId) {
      // The server restarted, so its ids started over: start over too.
      const restarted = bootId !== null;
      bootId = reply.boot_id;
      if (restarted) {
        log.replaceChildren();
        lastEventId = 0;
        reply = await getJson("/events?since=0");
      }
    }
    for (const e of reply.events) addEvent(log, e);
    while (log.children.length > KEPT_EVENTS) log.lastElementChild.remove();
  } catch (e) {
    /* the next poll retries */
  }
}

// One request at a time: the next poll starts a fixed delay after the last one finishes.
function every(fn, delayMs) {
  const tick = async () => {
    try { await fn(); } finally { setTimeout(tick, delayMs); }
  };
  tick();
}
every(pollFrame, 300);
every(pollEvents, 1000);
every(pollHealth, 1000);
</script>
</body>
</html>
